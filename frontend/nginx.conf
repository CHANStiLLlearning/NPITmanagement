server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Serve static React SPA routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy ALL backend API routes to the FastAPI backend
    # Covers: /api/, /auth/, /users/, /students/, /teachers/, /attendance/,
    #         /scores/, /academic/, /analytics/, /files/, /search/,
    #         /system-logs/, /reports-center/, /teaching-reports/
    location ~ ^/(api|auth|users|students|teachers|attendance|scores|academic|analytics|files|search|system-logs|reports-center|teaching-reports)(/|$) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy uploaded static assets
    location /static/uploads/ {
        proxy_pass http://backend:8000/static/uploads/;
        proxy_set_header Host $host;
    }
}
